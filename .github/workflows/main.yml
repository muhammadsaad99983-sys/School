name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare Flutter project
        run: |
          flutter create --platforms=android --project-name school_app /tmp/gen
          cp -r /tmp/gen/android ./android
          mkdir -p lib
          for f in *.dart; do mv "$f" lib/; done

      - name: Force compileSdk 36 for all plugins
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/force-sdk.gradle <<'EOF'
          allprojects {
              afterEvaluate { p ->
                  if (p.hasProperty("android")) {
                      p.android.compileSdkVersion 36
                  }
              }
          }
          EOF

      - name: Get packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: school-apk
          path: build/app/outputs/flutter-apk/app-release.apk
