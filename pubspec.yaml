publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.3
  image_picker: ^1.1.2
  file_picker: ^8.0.6
  share_plus: ^9.0.0
  csv: ^6.0.0
  excel: ^4.0.3
  pdf: ^3.11.0
  printing: ^5.12.0
  archive: ^3.6.1
  encrypt: ^5.0.3
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3
  open_filex: ^4.4.0

flutter:
  uses-material-design: true
